<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="./app/assets/css/style.css?v=5">
</head>
<body class="login-body">

    <div class="login-card">
      <div class="login-logo">🔗</div>
      <h1 class="login-title">CENTRAL OPERACIONAL</h1>
      <p class="login-sub">Acesse sua conta para continuar</p>

      <div id="login-erro" class="login-msg erro hidden"></div>
      <div id="login-ok"   class="login-msg ok   hidden"></div>

      <form id="form-login">
        <div class="login-field">
          <label>E-mail</label>
          <input type="email" id="l-email" placeholder="seu@email.com" autocomplete="email" required>
        </div>
        <div class="login-field">
          <label>Senha</label>
          <input type="password" id="l-senha" placeholder="••••••••••" maxlength="20" required>
        </div>
        <button type="submit" class="btn-login" id="btn-entrar">Entrar</button>
      </form>
    </div>
  
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="./app/assets/js/supabase-config.js"></script>
<script src="./app/assets/js/auth.js?v=5"></script>

  <!-- Crédito fixo canto inferior direito -->
  <div style="
    position: fixed;
    bottom: 20px;
    right: 24px;
    display: flex;
    align-items: center;
    gap: 10px;
    pointer-events: all;
  ">
    <em style="font-size: 0.78rem; color: var(--texto-dim); letter-spacing: 0.01em; white-space: nowrap;">
      Produzido por Pablo Freitas
    </em>
    <a
      href="https://www.linkedin.com/in/pablolfreitas/"
      target="_blank"
      rel="noopener noreferrer"
      title="LinkedIn de Pablo Freitas"
      class="linkedin-link"
      style="display:flex; align-items:center; opacity:0.8; transition: opacity 0.2s;"
    >
      <img
        src="./app/assets/img/logo-linkedin-2048.png"
        alt="LinkedIn"
        style="width: 76px; height: 76px; border-radius: 12px;"
      >
    </a>
  </div>
</body>
</html>
